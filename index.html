<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coffee Track - Tycoon & Master Barista</title>
    <script src="cordova.js"></script>
    <style>
        :root {
            --bg-color: #1a120b;
            --card-bg: #2c1e12;
            --accent-gold: #e6a15c;
            --coffee-brown: #3c2a21;
            --primary-red: #d62828;
            --success-green: #38b000;
            --text-light: #f5ebe0;
            --chip-bg: #4a3525;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg, #120a04 0%, #2c1e12 100%);
            color: var(--text-light);
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            min-height: 100vh;
        }

        .header-title {
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--accent-gold);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .header-stats {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border: 1px solid #5c4033;
            border-radius: 14px;
            padding: 10px 14px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.6);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .stat-box { text-align: center; }
        .stat-label { font-size: 0.65rem; color: #d5bdaf; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-value { font-size: 1.2rem; font-weight: 800; color: var(--accent-gold); }

        .character-zone {
            width: 100%;
            max-width: 480px;
            background: radial-gradient(circle, #4a3525 0%, #2c1e12 100%);
            border: 2px solid var(--accent-gold);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        .customer-avatar {
            font-size: 2.8rem;
            background: rgba(255,255,255,0.1);
            padding: 6px;
            border-radius: 50%;
            border: 2px solid var(--accent-gold);
        }

        .speech-bubble {
            flex: 1;
            background: #ffffff;
            color: #222;
            padding: 10px 12px;
            border-radius: 12px;
            position: relative;
            font-weight: 700;
        }

        .speech-bubble::before {
            content: '';
            position: absolute;
            left: -10px;
            top: 50%;
            transform: translateY(-50%);
            border-width: 6px 10px 6px 0;
            border-style: solid;
            border-color: transparent #ffffff transparent transparent;
        }

        .customer-name { font-size: 0.75rem; color: #b07d62; text-transform: uppercase; }
        .order-name { font-size: 0.95rem; color: #111; }

        .game-card {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid #5c4033;
            border-radius: 16px;
            padding: 14px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            margin-bottom: 10px;
        }

        .plate-area {
            min-height: 65px;
            border: 2px dashed #8d6e63;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px;
            margin-bottom: 10px;
            background-color: #1a120b;
            flex-wrap: wrap;
        }

        .ingredient-chip {
            background-color: var(--chip-bg);
            border: 1px solid #8d6e63;
            color: var(--text-light);
            padding: 5px 10px;
            border-radius: 16px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .grid-ingredients {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }

        .btn-ingredient {
            background: linear-gradient(145deg, #4a3525, #3c2a21);
            color: #fff;
            border: 1px solid #6b4d38;
            padding: 10px 4px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn-ingredient:active { transform: scale(0.95); }

        .action-buttons { display: flex; gap: 8px; }
        .btn-action {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            color: white;
            text-transform: uppercase;
        }

        .btn-serve { background-color: var(--success-green); }
        .btn-clear { background-color: var(--primary-red); }

        .upgrade-card {
            width: 100%;
            max-width: 480px;
            background: #23170f;
            border: 1px solid var(--accent-gold);
            border-radius: 16px;
            padding: 12px;
        }

        .upgrade-title {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--accent-gold);
            margin-bottom: 8px;
            text-transform: uppercase;
            text-align: center;
        }

        .upgrade-list {
            display: flex;
            gap: 8px;
        }

        .btn-upgrade {
            flex: 1;
            background: #3c2a21;
            border: 1px solid var(--accent-gold);
            color: #fff;
            padding: 8px;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
            text-align: center;
        }

        .btn-upgrade:disabled { opacity: 0.4; }

        .message-box {
            text-align: center;
            font-weight: 800;
            height: 20px;
            margin-top: 6px;
            font-size: 0.9rem;
        }

        .success { color: #38b000; }
        .error { color: #ff4d4d; }
    </style>
</head>
<body>

    <div class="header-title">☕ COFFEE TRACK TYCOON ☕</div>

    <div class="header-stats">
        <div class="stat-box">
            <div class="stat-label">Money</div>
            <div class="stat-value" id="money" style="color: #38b000;">$0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Score</div>
            <div class="stat-value" id="score">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Customer</div>
            <div class="stat-value" id="customer">#1</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Time</div>
            <div class="stat-value" id="timer" style="color: var(--primary-red);">60s</div>
        </div>
    </div>

    <div class="character-zone">
        <div class="customer-avatar" id="customer-avatar">👨‍💻</div>
        <div class="speech-bubble">
            <div class="customer-name" id="customer-type">Software Engineer</div>
            <div class="order-name">I'd like a <strong id="target-coffee-name" style="color:#6b4d38;">Loading...</strong></div>
            <div id="target-ingredients" style="margin-top: 4px; display:flex; gap:4px; flex-wrap:wrap;"></div>
        </div>
    </div>

    <div class="game-card">
        <div style="font-size: 0.75rem; color: #d5bdaf; margin-bottom: 4px; font-weight:700;">BARISTA COUNTER:</div>
        <div class="plate-area" id="plate">
            <span style="color: #8d6e63; font-size: 0.8rem;">Select ingredients to brew coffee...</span>
        </div>

        <div style="font-size: 0.75rem; color: #d5bdaf; margin-bottom: 4px; font-weight:700;">INGREDIENTS & MENU:</div>
        <div class="grid-ingredients">
            <button class="btn-ingredient" onclick="addIngredient('Espresso Shot')">☕ Espresso</button>
            <button class="btn-ingredient" onclick="addIngredient('Steamed Milk')">🥛 Milk</button>
            <button class="btn-ingredient" onclick="addIngredient('Hot Water')">💧 Hot Water</button>
            <button class="btn-ingredient" onclick="addIngredient('Chocolate Syrup')">🍫 Chocolate</button>
            <button class="btn-ingredient" onclick="addIngredient('Ice Cubes')">🧊 Ice</button>
            <button class="btn-ingredient" onclick="addIngredient('Whipped Cream')">🧁 Cream</button>
            <button class="btn-ingredient" onclick="addIngredient('Caramel Syrup')">🍯 Caramel</button>
            <button class="btn-ingredient" onclick="addIngredient('Croissant')">🥐 Croissant</button>
            <button class="btn-ingredient" onclick="addIngredient('Muffin')">🧁 Muffin</button>
        </div>

        <div class="action-buttons">
            <button class="btn-action btn-clear" onclick="clearPlate()">Clear Cup</button>
            <button class="btn-action btn-serve" onclick="serveOrder()">Serve Coffee</button>
        </div>

        <div class="message-box" id="message"></div>
    </div>

    <div class="upgrade-card">
        <div class="upgrade-title">🛠️ SHOP UPGRADES & REVENUE 🛠️</div>
        <div class="upgrade-list">
            <button class="btn-upgrade" id="up-machine" onclick="buyUpgrade('machine', 50)">
                ⚡ Espresso Machine<br><strong>$50 (+50% Price)</strong>
            </button>
            <button class="btn-upgrade" id="up-beans" onclick="buyUpgrade('beans', 100)">
                🌟 Premium Beans<br><strong>$100 (+100% Price)</strong>
            </button>
        </div>
    </div>

    <script>
        const customers = [
            { type: "Software Engineer", avatar: "👨‍💻" },
            { type: "University Student", avatar: "👩‍🎓" },
            { type: "Business Executive", avatar: "👔" },
            { type: "Gourmet Foodie", avatar: "🧑‍🍳" },
            { type: "Tourist", avatar: "📸" }
        ];

        const recipes = [
            { name: "Espresso", ingredients: ["Espresso Shot"] },
            { name: "Americano", ingredients: ["Espresso Shot", "Hot Water"] },
            { name: "Cafe Latte", ingredients: ["Espresso Shot", "Steamed Milk"] },
            { name: "Cappuccino", ingredients: ["Espresso Shot", "Steamed Milk", "Whipped Cream"] },
            { name: "Caffe Mocha", ingredients: ["Espresso Shot", "Steamed Milk", "Chocolate Syrup"] },
            { name: "Iced Caramel Latte", ingredients: ["Espresso Shot", "Steamed Milk", "Ice Cubes", "Caramel Syrup"] },
            { name: "Breakfast Combo", ingredients: ["Espresso Shot", "Steamed Milk", "Croissant"] }
        ];

        let currentRecipe = {};
        let currentCustomer = {};
        let currentPlate = [];
        let score = 0;
        let money = 0;
        let priceMultiplier = 1;
        let customerCount = 1;
        let timeLeft = 60;
        let timerInterval;

        function startGame() {
            score = 0;
            money = 0;
            priceMultiplier = 1;
            customerCount = 1;
            timeLeft = 60;
            updateStats();
            nextOrder();
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft + "s";
                if(timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert("⏰ Shift Ended Master Barista!\nTotal Revenue: $" + money + "\nFinal Score: " + score);
                    startGame();
                }
            }, 1000);
        }

        function updateStats() {
            document.getElementById('money').innerText = "$" + money;
            document.getElementById('score').innerText = score;
            document.getElementById('customer').innerText = "#" + customerCount;
        }

        function nextOrder() {
            currentCustomer = customers[Math.floor(Math.random() * customers.length)];
            currentRecipe = recipes[Math.floor(Math.random() * recipes.length)];

            document.getElementById('customer-avatar').innerText = currentCustomer.avatar;
            document.getElementById('customer-type').innerText = currentCustomer.type;
            document.getElementById('target-coffee-name').innerText = currentRecipe.name;
            
            const targetDiv = document.getElementById('target-ingredients');
            targetDiv.innerHTML = '';
            currentRecipe.ingredients.forEach(ing => {
                const chip = document.createElement('span');
                chip.className = 'ingredient-chip';
                chip.innerText = ing;
                targetDiv.appendChild(chip);
            });
            clearPlate();
        }

        function addIngredient(ing) {
            currentPlate.push(ing);
            renderPlate();
        }

        function clearPlate() {
            currentPlate = [];
            renderPlate();
        }

        function renderPlate() {
            const plateDiv = document.getElementById('plate');
            plateDiv.innerHTML = '';
            if(currentPlate.length === 0) {
                plateDiv.innerHTML = '<span style="color: #8d6e63; font-size: 0.8rem;">Select ingredients to brew coffee...</span>';
                return;
            }
            currentPlate.forEach(ing => {
                const chip = document.createElement('span');
                chip.className = 'ingredient-chip';
                chip.innerText = ing;
                plateDiv.appendChild(chip);
            });
        }

        function serveOrder() {
            const msgBox = document.getElementById('message');
            const isCorrect = currentPlate.length === currentRecipe.ingredients.length &&
                              currentPlate.every((val, index) => val === currentRecipe.ingredients[index]);

            if (isCorrect) {
                const earnedMoney = Math.round(15 * priceMultiplier);
                money += earnedMoney;
                score += 20;
                msgBox.className = "message-box success";
                msgBox.innerText = "+$" + earnedMoney + " Earned! Perfect Coffee!";
                customerCount++;
                updateStats();
                setTimeout(() => {
                    msgBox.innerText = "";
                    nextOrder();
                }, 1000);
            } else {
                money = Math.max(0, money - 5);
                msgBox.className = "message-box error";
                msgBox.innerText = "-$5 Refund! Wrong Order!";
                updateStats();
            }
        }

        function buyUpgrade(type, cost) {
            if (money >= cost) {
                money -= cost;
                if (type === 'machine') {
                    priceMultiplier += 0.5;
                    document.getElementById('up-machine').disabled = true;
                    document.getElementById('up-machine').innerText = "⚡ Machine Upgraded!";
                } else if (type === 'beans') {
                    priceMultiplier += 1.0;
                    document.getElementById('up-beans').disabled = true;
                    document.getElementById('up-beans').innerText = "🌟 Beans Upgraded!";
                }
                updateStats();
            } else {
                alert("Not enough money! Serve more coffee first.");
            }
        }

        window.onload = startGame;
    </script>
</body>
</html>
